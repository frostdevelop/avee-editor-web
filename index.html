<!DOCTYPE html>
<html>
<head>
	<title>Avee Player Editor</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<!-- https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/dist/zip.min.js
	<link rel='preload' href='zip.min.js' as='script'/> -->
	<script src="zip.min.js"></script>
	<link rel='stylesheet' href='style.css'/>
</head>

<body lang="en">
	<div id='mainWorkspace'>
		<div id='avee-controls' class='span-2'>
			<label class='neofilebutton'>
			<input type='file' id='avee-viz-input' accept='.viz, .zip'></input>
			<span class='button bbtn'>Import Vizualizer</span>
			</label>
			<button class='button' id='avee-export'>Export Vizualizer</button>
			<input placeholder='AveeEditorExport.viz' type="text" title='Name of export' id='avee-filename'></input>
		</div>
		<div class='mainSection'>
			<div class='sectionHeader'>
				<h2>Compositions</h2>
				<button class='button bbtn' id='avee-addcomp-btn'>Add Composition</button>
			</div>
			<div id='avee-structure'>There doesn't seem to be any compositions...<br/>Try pressing "Import visualizer"</div>
		</div>
		<div class='mainSection'>
			<div class='sectionHeader'>
				<h2>Images</h2>
				<label class='neofilebutton'>
				<input type='file' id='avee-img-input' accept='image/*' multiple></input>
				<span class='button bbtn'>Upload Image</span>
				</label>
			</div>
			<div id='avee-files'>There doesn't seem to be any images...<br/>Try pressing "Import visualizer"</div>
		</div>
		<h3 id='avee-status'class='span-2'>IDLE</h3>
	</div>
	<footer>Ra1.2.1<br/>© 2026 Frostbyte | AGPL-3.0</footer>
